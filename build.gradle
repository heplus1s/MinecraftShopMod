plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

def bankStubClasses = layout.buildDirectory.dir('bankstub')

tasks.register('compileBankStub', JavaCompile) {
    group = 'build'
    description = 'Compile unshipped bank API stubs used only while compiling the optional bridge.'
    source = fileTree('src/bankstub/java')
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = bankStubClasses
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 17
}

tasks.named('compileJava', JavaCompile).configure {
    dependsOn 'compileBankStub'
    classpath += files(bankStubClasses)
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

test {
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.register('verifyProductionJar') {
    group = 'verification'
    description = 'The remapped jar must stay free of bank classes and load on a server or a client.'
    dependsOn tasks.named('remapJar')
    doLast {
        def file = tasks.named('remapJar').get().outputs.files.singleFile
        def zip = new java.util.zip.ZipFile(file)
        try {
            def names = zip.entries().collect { it.name }
            def leaked = names.findAll { it.startsWith('dev/jdguo/bank/') }
            if (!leaked.isEmpty()) {
                throw new GradleException('Production jar contains bank classes: ' + leaked)
            }
            if (!names.contains('dev/jdguo/shop/ui/ShopChestUiHooks.class')) {
                throw new GradleException('Production jar is missing ShopChestUiHooks')
            }
            if (!names.contains('LICENSE_shopmod')) {
                throw new GradleException('Production jar is missing the MIT license')
            }
            def mod = zip.getEntry('fabric.mod.json')
            if (mod == null) {
                throw new GradleException('Production jar is missing fabric.mod.json')
            }
            def text = zip.getInputStream(mod).getText('UTF-8')
            if (!text.contains('"environment": "*"')) {
                throw new GradleException('fabric.mod.json must set environment to * so dedicated servers and singleplayer both load it')
            }
            def depends = (text =~ /"depends"\s*:\s*\{([^}]*)\}/)
            if (!depends.find() || depends.group(1).contains('bankmod')) {
                throw new GradleException('bankmod must stay out of depends: ' + text)
            }
            def suggests = (text =~ /"suggests"\s*:\s*\{([^}]*)\}/)
            if (!suggests.find() || !suggests.group(1).contains('bankmod')) {
                throw new GradleException('bankmod should be an optional suggestion')
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('build') {
    dependsOn 'verifyProductionJar'
}

loom {
    splitEnvironmentSourceSets()
    mods {
        shopmod {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Keep the migrated UI unit tests on the client compilation classpath.
sourceSets.test.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
tasks.named("compileTestJava") { dependsOn tasks.named("clientClasses") }
